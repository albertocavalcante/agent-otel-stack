# Until this existed, every gate in this repository ran only where somebody had
# remembered `lefthook install`. A fork, a pull request, or a fresh clone that
# skipped setup got no enforcement at all — and `lefthook.yml` says so in its
# own first comment. That is a repo whose checks are advisory pretending to be a
# repo whose checks are binding.
#
# `just check` is deliberately network-free, so it runs here unchanged. The two
# gates that depend on the outside world are excluded by design and run on
# demand: `just pins` needs a registry, `just copilot-check` needs a local
# VS Code install.
#
# Tool installs use each project's own documented method rather than
# `releases/latest/download/<name>.tar.gz`, which 404s for any project whose
# asset filenames carry the version — as just's do. The first version of this
# file made exactly that mistake and failed on its first run.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0

      - name: Install shellcheck
        run: sudo apt-get install -y -qq shellcheck

      - name: Install ruff and PyYAML
        run: pip install --quiet ruff pyyaml

      - name: Versions
        run: just --version && shfmt --version && shellcheck --version && ruff --version

      - name: just check
        run: just check

      - name: just test
        run: just test
