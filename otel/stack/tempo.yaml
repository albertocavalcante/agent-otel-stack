# Tempo, single binary, local disk. Enough to prove a span survives the whole
# path; not a production topology.
#
# The OTLP receiver here is what `just stack-check` queries after posting a
# span to the agent. If that query returns the span, every hop worked.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # Without this, a discarded trace is invisible: the distributor returns HTTP
  # 200 while ingestion limits are enforced asynchronously downstream. See
  # README trap-adjacent notes in docs/06-stack.md.
  log_discarded_spans:
    enabled: true
    include_all_attributes: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
