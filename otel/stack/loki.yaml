# Loki, single binary, filesystem storage. Local verification only.
#
# reject_old_samples_max_age is widened here, and it matters how far.
#
# Loki's DEFAULT is 1w — which is 168h. An earlier revision of this file set
# 168h and claimed it was a deliberate override; it was the default written out
# longhand, and it changed nothing. Anything replayed from a backlog is old by
# definition, so the window has to be wider than the outage you expect to
# survive, not equal to the default.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days. Loki's default is 1w (168h); a queue that drained after a longer
  # offline period would be silently discarded at the door.
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  # Out-of-order writes are what a replay looks like.
  unordered_writes: true
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
