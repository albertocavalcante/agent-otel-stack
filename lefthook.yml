pre-commit:
  parallel: true
  commands:
    check:
      run: just check
      fail_text: "Repository checks failed. Run `just check` to see which of leaks/links/sources/measurements broke."

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .{1,72}$'
      fail_text: "Commit subject must be Conventional Commits: `type(scope): description`, scope optional, subject <= 72 chars. Types: feat fix docs style refactor perf test build ci chore revert."
